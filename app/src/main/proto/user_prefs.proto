syntax = "proto3";

option java_package = "com.steampigeon.flightmanager";
option java_multiple_files = true;

message UserPreferences {
  // Locator statistics screen offset
  int32 locator_statistics_offset_x = 1;
  int32 locator_statistics_offset_y = 2;
  bool voice_enabled = 3;
  string voice_name = 4;
  string receiver_name = 5;
  // Locators the app has been authorized to connect to (keyed by locator_id).
  // Presence + a matching password_key lets the app recognize a locator's
  // PreLaunchData without re-prompting for its password.
  map<uint32, KnownLocator> known_locators = 6;
  // Field 7 was last_locator_id, a persisted recognition restored at startup so
  // an app opened while the locator was armed could show telemetry. Retired once
  // TelemetryData started carrying its own locator_id + auth_tag (ADR-0006), which
  // authenticates the armed case directly instead of trusting a stored id. Not
  // reused: an installed app may still have a value written under this number.
  reserved 7;
  // Closest zoom the live map's AUTO-zoom will frame to. Pinch is not bound by
  // it. Exists so GPS error at close range cannot make the map jump zoom levels
  // on every fix — see MAP_ZOOM_LIMIT_DEFAULT in FlightMapScreen.kt.
  //
  // `optional` for explicit presence, so "the user has not chosen" stays
  // distinguishable from any stored number. Plain proto3 would read 0 for both,
  // and folding them together freezes every existing install at whatever the
  // default was when they last saved — a later change to that default would
  // never reach them.
  optional int32 map_max_zoom = 8;
}

message KnownLocator {
  fixed32 id = 1;            // locator_id (STM MPU UID)
  fixed32 password_key = 2;  // FNV-1a of the accepted password (0 = open)
  string label = 3;          // device name last seen, for display
}